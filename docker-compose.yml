services:
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: academico_db
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:senha@db:3306/academico_db
      PORT: 3000
    depends_on:
      - db

  web:
    build:
      context: ./frontend/vite-project
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mysql_data:
